name: Bug report
description: Something in ClassicStation doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The more of the fields below you fill in, the faster it can be fixed. Problems that only happen with one game or one core usually belong to that core's repository.
  - type: dropdown
    id: console
    attributes:
      label: Console
      options:
        - SNES Classic (USA)
        - SNES Classic (EUR)
        - Super Famicom Classic
        - NES Classic
        - Famicom Classic
        - Famicom Shonen Jump
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ClassicStation version
      description: Shown in the About screen of the menu, or in the name of the release you installed.
      placeholder: e.g. v0.1.0-alpha.2
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: System, game and core
      description: Only if the problem is with starting or playing a game.
      placeholder: e.g. Arcade, Mortal Kombat II, km_mame2003_plus
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ClassicStation
        2. Go to ...
        3. ...
  - type: textarea
    id: mods
    attributes:
      label: Other mods installed
      description: In hakchi, **Modules → Generate modules report**, then paste it here or attach the file.
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: |
        The ES log is `/var/lib/hakchi/emulationstation/home/.emulationstation/es_log.txt`, and a crash leaves `/var/lib/hakchi/emulationstation/crash.log`. Attach them, or a photo or screenshot of the problem, by dragging them here.
