name: Check

on:
  pull_request:
  push:
    branches: [classicstation, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Run the pre-commit hooks
        run: pipx run pre-commit run --all-files --show-diff-on-failure

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build EmulationStation
        run: sh classicmini/build.sh

      - name: Build the console tools
        run: sh classicmini/build-tools.sh

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Run the tests
        run: sh classicmini/tests/run.sh
